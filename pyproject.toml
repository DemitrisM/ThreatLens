[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
dynamic = ["version"]
description = "Portable CLI malware triage and analysis tool with transparent confidence scoring"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pefile>=2023.2.7",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
analysis = [
    "python-magic>=0.4.27",
    "py-tlsh>=4.12.0",
    "ppdeep>=20200000",
    "yara-python>=4.3.0",
    "oletools>=0.60.1",
    "pcodedmp>=1.2.6",
    "XLMMacroDeobfuscator>=0.2.7",
    "peepdf-3>=4.0.0",
    "rarfile>=4.1",
    "py7zr>=0.20.8",
    "pycdlib>=1.14.0",
]
# The C ssdeep binding, kept OUT of `analysis` on purpose. It is sdist-only
# and needs libfuzzy-dev plus a compiler, so listing it there would turn a
# working `pip install .[analysis]` into a build failure on any machine
# without them — and `file_intake` already falls back to the pure-Python
# `ppdeep`, so its absence costs speed, not capability.
#
#   sudo apt-get install libfuzzy-dev
#   pip install --no-build-isolation '.[fast-hashing]'
#
# --no-build-isolation is required: ssdeep 3.4's setup.py imports
# pkg_resources, which setuptools 81+ no longer ships, so an isolated build
# fails with ModuleNotFoundError before it ever reaches the compiler.
#
# Measured on real corpus samples, C against ppdeep, identical digests:
#   Efimer.exe                13.6 MB   10.75s -> 0.196s   (55x)
#   CVE-2025-8088 + UKR,.rar  30.0 MB  160.44s -> 0.457s  (351x)
# It also lifts `max_ppdeep_size_mb`, which applies to the fallback only —
# 19 of 313 corpus samples get no fuzzy hash at all without it.
fast-hashing = [
    "ssdeep>=3.4",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
dynamic = [
    "speakeasy-emulator>=1.5.9",
]

[project.scripts]
threatlens = "cli:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = {attr = "cli.__version__"}

# Discovered rather than listed — the hand-maintained list went stale twice
# (reporting.terminal_reporter, reporting.html_reporter and five
# modules.static.* subpackages were all missing).
[tool.setuptools.packages.find]
include = ["cli*", "core*", "modules*", "reporting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus scans that need the network or a two-minute capa run are
# deselected by default; `-m corpus_slow` runs them on their own.
addopts = "-q -m 'not corpus_slow'"
markers = [
    "corpus_slow: real scans with virustotal and capa_analysis enabled",
]
