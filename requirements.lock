# ThreatLens dependency lockfile — exact pins, dependencies only.
#
# Regenerate deliberately, never casually:
#
#   python3 -m venv /tmp/lockvenv                 # NO --system-site-packages
#   /tmp/lockvenv/bin/pip install --upgrade pip setuptools wheel cffi
#   /tmp/lockvenv/bin/pip install --no-build-isolation \
#       ".[analysis,tools,fast-hashing,dev]"
#   /tmp/lockvenv/bin/python -m pytest tests/      # must pass BEFORE pinning
#   /tmp/lockvenv/bin/pip freeze                   # then strip ThreatLens itself
#
# Why this file exists. Every dependency in pyproject.toml is specified with
# >= and no upper bound, and there was no lockfile, so two installs of the
# same commit produced different builds. Measured: a hermetic install
# resolved click==8.5.0 on the same day the development venv held 8.3.1.
# Reproducibility is the strongest argument for the container, and it is
# hollow without this file.
#
# Three things to know:
#
# 1. ThreatLens itself is deliberately absent. pip freeze emits it as
#    "threatlens @ file:///absolute/path", which no other machine can build
#    and which leaks a local path. The image copies the source to /app and
#    runs it from there; it never installs the project as a package.
#
# 2. --no-build-isolation is required. ssdeep 3.4's setup.py imports
#    pkg_resources, which setuptools 81+ no longer ships, so an isolated
#    build of it fails before reaching the compiler. py-tlsh also builds
#    from source and needs a compiler and headers present.
#
# 3. These are version pins, not hashes. They stop version drift; they do
#    not defend against a tampered index. --require-hashes would, and is
#    a deliberate non-goal for now.
#
# Generated from an environment in which the full suite passed.
