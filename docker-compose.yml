# How to RUN the image. The Dockerfile says how to build it; this file is the
# long `docker run` line written down once, so nobody has to remember it.
#
# Requires the `docker compose` plugin, v2 or newer — the version numbering has
# since moved past 2, so this is not a pin. What it rules out is the
# end-of-life `docker-compose` v1 script, whose handling of the long-form tmpfs
# mount below is not something to rely on.
#
#   docker compose build
#   docker compose run --rm threatlens rules update     # first run only
#   docker compose run --rm offline scan sample.exe     # the normal case
#   docker compose run --rm threatlens scan sample.exe  # only if you need VT
#
# TWO SERVICES, and the difference matters. `offline` has no network at all
# and is the right one for scanning a sample. `threatlens` has egress, which
# only `rules update` and the virustotal module need.
#
# The reason this is not one service with a flag: analysing a PDF EXECUTES
# the JavaScript it contains, in a V8 engine (see pdf_javascript_execution in
# config.yaml), and the Excel-4.0 pass interprets macro formulas. Running
# attacker-controlled code and holding an open route to the internet in the
# same container is a combination worth having to ask for by name.

services:
  threatlens:
    build: .
    image: threatlens:0.5.18

    volumes:
      # Your samples, READ-ONLY. A static scan never writes to a sample, so
      # it is not given the chance to.
      - ./samples:/data:ro

      # Reports, at a TOP-LEVEL path and deliberately not inside /data.
      # Nested inside the samples mount, Docker would create the mount point
      # on the host — a root-owned `reports/` appearing inside your own
      # samples folder — and `triage /data` would then walk the JSON it had
      # just written.
      - ./reports:/reports

      # YARA rules as a NAMED volume, not a bind mount, so `rules update`
      # survives the container exiting. A bind mount here would shadow the
      # directory and its ownership instead.
      - threatlens-rules:/app/rules/yara

      # /tmp is where archive extraction lands, so it is sized from the
      # extraction budget rather than from anything else:
      # max_archive_extracted_size_mb is 500 PER ARCHIVE and recursion goes
      # three deep, and nested children are analysed sequentially with each
      # cleaning up before the next, so the worst case is parent + one child
      # per level — about 1.5 GB. Note this is RAM, not disk.
      #
      # Long form on purpose. The short form (`tmpfs: - /tmp:size=2g`) is
      # Docker CLI syntax and whether Compose parses the suffix is
      # version-dependent; this spelling is unambiguous.
      #
      # Docker mounts tmpfs noexec, and that is kept: extracted malware lands
      # here, and being unable to execute it from here is worth having.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2147483648        # 2 GiB

    environment:
      # Design rule 9: the key never reaches argv, only the environment.
      - THREATLENS_VT_KEY=${THREATLENS_VT_KEY:-}

      # Read by entrypoint.sh, which corrects mount ownership as root and
      # then drops to this uid/gid with gosu. Set them in .env to your own
      # `id -u` / `id -g`, or reports arrive on the host owned by 1000.
      - TL_UID=${TL_UID:-1000}
      - TL_GID=${TL_GID:-1000}

    # So `scan sample.exe` means ./samples/sample.exe, not /app/sample.exe.
    # The image's own paths are absolute in config.docker.yaml precisely so
    # this can point at the user's mount.
    working_dir: /data

    # ── Containment ──────────────────────────────────────────────────────
    # Every value below was measured against this image, not copied from a
    # hardening guide. `docker run --cap-drop ALL` on its own FAILS with
    #   error: failed switching to "1000:1000": operation not permitted
    # because entrypoint.sh starts as root and gosu needs SETUID/SETGID to
    # drop privileges. So capabilities are dropped and three are added back,
    # which is the smallest set that still starts and still corrects mount
    # ownership:
    #
    #   SETUID, SETGID  gosu's privilege drop
    #   CHOWN           entrypoint.sh fixing ownership of /reports
    #
    # Verified by scanning a real PDF from the corpus under this exact
    # profile and comparing the payload against the unhardened run.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN

    # Blocks privilege gain through a setuid binary. gosu DROPS privilege, so
    # this does not interfere — tested.
    security_opt:
      - no-new-privileges:true

    # A fork bomb in an emulated or interpreted payload stops at the limit
    # instead of at the host's process table. Generous: capa and FLOSS are
    # subprocesses and archive extraction fans out.
    pids_limit: 512

    # Sample bytes never leave the machine regardless: design rule 3 means
    # VirusTotal is queried by hash only.

  # The same image with no network whatsoever. Use this to scan things.
  #
  # `network_mode: none` is a property of the container, which is exactly why
  # it has to be a separate service: it cannot be applied to one Python call
  # site while leaving the virustotal module able to reach the API. An
  # earlier attempt to express that as a single hardened service was wrong
  # for that reason.
  #
  # Note also that an in-container network namespace is NOT an alternative:
  # `unshare -rn` as the unprivileged analysis user is refused
  # ("unshare failed: Operation not permitted") without CAP_SYS_ADMIN, which
  # would give back more than the isolation is worth.
  offline:
    extends:
      service: threatlens
    network_mode: none

volumes:
  threatlens-rules:
